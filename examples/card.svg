<svg xmlns="http://www.w3.org/2000/svg" width="420" height="180" class="">
  <foreignObject x="0" y="0" width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;justify-content:center;padding:22px 26px;font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:#e6edf3;background:radial-gradient(120% 120% at 0% 0%,rgba(139,92,246,.18),transparent 55%),radial-gradient(120% 120% at 100% 100%,rgba(34,211,238,.16),transparent 55%),#0d1117;border:1px solid #21262d;border-radius:14px;">
      <div style="font-weight:700;font-size:18px;color:#a78bfa;">Example card</div>
      <div style="font-size:14px;line-height:1.5;color:#c9d1d9;">
        A &lt;foreignObject&gt; card with the two classic traps: no viewBox on the
        root, and width/height="100%" on the foreignObject. Looks fine on desktop
        Chrome; clips on iPhone. Run <code style="color:#22d3ee;">svgsafe doctor</code>.
      </div>
    </div>
  </foreignObject>
</svg>
