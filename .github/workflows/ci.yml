name: CI

# Cross-OS by default: svgsafe must run on macOS, Linux, and Windows, so the full
# matrix is the gate. `render` drives an installed Chrome (provided here by
# setup-chrome on every OS — never downloaded by svgsafe itself).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Install Google Chrome STABLE (what real users have), not the bleeding-edge
      # chromium snapshot — the snapshot has dropped old-headless and won't exit
      # after a CLI --screenshot. svgsafe never downloads a browser itself.
      - name: Install Chrome stable (for the render smoke)
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Test
        run: pnpm test
        env:
          SVGSAFE_CHROME: ${{ steps.chrome.outputs.chrome-path }}
