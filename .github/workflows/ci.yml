name: CI

# Cross-OS by default: svgsafe must run on macOS, Linux, and Windows, so the full
# matrix is the gate. `render` drives an installed Chrome (provided here by
# setup-chrome on every OS — never downloaded by svgsafe itself).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # svgsafe drives an installed Chrome over CDP (never downloads one).
      - name: Install Chrome stable (for the render smoke)
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # On macOS the setup-chrome *chromium* build has a headless Mach-port IPC bug
      # ("No rendezvous client"); use the runner's preinstalled real Google Chrome.
      - name: Test (macOS → real Google Chrome)
        if: runner.os == 'macOS'
        run: pnpm test
        env:
          SVGSAFE_CHROME: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome

      - name: Test (Linux/Windows → setup-chrome)
        if: runner.os != 'macOS'
        run: pnpm test
        env:
          SVGSAFE_CHROME: ${{ steps.chrome.outputs.chrome-path }}
